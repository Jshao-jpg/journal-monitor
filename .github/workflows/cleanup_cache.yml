name: Cleanup Caches

on:
  workflow_dispatch: # 手动触发

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Caches
        run: |
          echo "正在获取缓存列表..."
          # 获取所有缓存 ID
          ids=$(gh cache list --limit 100 --json id --jq '.[].id')
          
          if [ -z "$ids" ]; then
            echo "没有发现任何缓存。"
            exit 0
          fi

          echo "发现缓存，正在逐一删除..."
          for id in $ids; do
            echo "正在删除缓存 ID: $id"
            gh cache delete $id || echo "删除 ID $id 失败，跳过。"
          done
          echo "清理任务尝试完成。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
