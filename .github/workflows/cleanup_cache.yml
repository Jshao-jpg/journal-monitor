name: Cleanup Caches

on:
  workflow_dispatch: # 手动触发

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Caches
        run: |
          echo "正在尝试清理仓库: ${{ github.repository }} 的所有缓存..."
          gh cache delete --all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
