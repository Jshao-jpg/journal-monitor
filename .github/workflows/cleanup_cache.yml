name: Cleanup Caches

on:
  workflow_dispatch: # 手动触发

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup All Caches via API
        uses: actions/github-script@v6
        with:
          script: |
            let totalDeleted = 0;
            while (true) {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              
              const list = caches.data.actions_caches;
              if (list.length === 0) {
                console.log(`清理完毕！共删除 ${totalDeleted} 个缓存。`);
                break;
              }
              
              console.log(`本批发现 ${list.length} 个缓存，正在删除...`);
              for (const cache of list) {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                totalDeleted++;
              }
              console.log(`已累计删除 ${totalDeleted} 个，继续检查...`);
            }
